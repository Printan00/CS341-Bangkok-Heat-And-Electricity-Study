<title>BHES Heat & Electricity Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Q1-Q3 findings of the Happy Home survey from Amazon Athena: heat vulnerability, electricity burden and support priority.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* Layout concept: quiet single column, one accent (teal), whitespace and hairlines instead of cards; one page per research question. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #14181d;
  --muted: #5b6470;
  --rule: #e2e5ea;
  --accent: #0d6e73;
  --accent-soft: #dbeeee;
  --heat-lo: #eaf4f4;
  --heat-hi: #0b5559;
  --good: #1a7a48;
  --good-soft: #dff2e7;
  --warn: #a35f00;
  --warn-soft: #fbeccf;
  --bad: #b03a31;
  --bad-soft: #f8e1de;
  --neutral-soft: #e9ebef;
  --hatch: #c7ccd4;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #141a20; --fg: #e8ecf1; --muted: #9aa5b3; --rule: #242c35;
    --accent: #4cbfc4; --accent-soft: #173538; --heat-lo: #12282b; --heat-hi: #5ccfd4;
    --good: #5dcf92; --good-soft: #173626; --warn: #e5a54a; --warn-soft: #3a2c12;
    --bad: #ef8a80; --bad-soft: #3d1f1c; --neutral-soft: #202830; --hatch: #3a4450;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #141a20; --fg: #e8ecf1; --muted: #9aa5b3; --rule: #242c35;
  --accent: #4cbfc4; --accent-soft: #173538; --heat-lo: #12282b; --heat-hi: #5ccfd4;
  --good: #5dcf92; --good-soft: #173626; --warn: #e5a54a; --warn-soft: #3a2c12;
  --bad: #ef8a80; --bad-soft: #3d1f1c; --neutral-soft: #202830; --hatch: #3a4450;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
#app { min-height: 100vh; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }

/* language switch: th | en | both */
#app[data-lang="th"] .en { display: none; }
#app[data-lang="en"] .th { display: none; }
#app[data-lang="both"] .en { display: block; color: var(--muted); font-size: .84em; font-weight: 400; line-height: 1.45; }
#app[data-lang="both"] .inl .en { display: inline; }
#app[data-lang="both"] .inl .en::before { content: " · "; }

/* header */
.top { border-bottom: 1px solid var(--rule); background: var(--surface); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); font-size: .8em; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; line-height: 1.3; }
.nav a:hover { color: var(--fg); background: var(--neutral-soft); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav a:focus-visible, .lang button:focus-visible, summary:focus-visible, .copy:focus-visible, .cell:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.lang button { font: inherit; font-size: .82em; background: transparent; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* page */
main { padding-block: 40px 72px; }
.eyebrow { font-size: .78em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.25; font-weight: 600; margin: 8px 0 12px; text-wrap: balance; }
h2 { font-size: 1.25rem; line-height: 1.35; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; }
.lead { color: var(--muted); max-width: 68ch; margin: 0 0 8px; }
.q-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.verdict { display: inline-flex; flex-direction: column; gap: 0; padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: .92em; line-height: 1.35; }
.verdict .en { font-weight: 400; }
.v-good { background: var(--good-soft); color: var(--good); }
.v-warn { background: var(--warn-soft); color: var(--warn); }
.v-bad { background: var(--bad-soft); color: var(--bad); }
.v-neutral { background: var(--neutral-soft); color: var(--muted); }
.answer { margin: 20px 0 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.answer p { margin: 0 0 6px; max-width: 72ch; }
.answer .big { font-size: 1.05rem; font-weight: 500; }

.panel { padding-block: 36px 8px; border-top: 1px solid var(--rule); margin-top: 28px; }
.panel:first-of-type { margin-top: 20px; }
.panel .lead { margin-bottom: 18px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 14px; font-size: .8em; color: var(--muted); }
.foot .src { font-family: var(--font-mono); }
details.sql { margin-top: 10px; }
details.sql summary { cursor: pointer; color: var(--accent); font-size: .85em; font-weight: 500; width: fit-content; }
details.sql pre { margin: 10px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; max-height: 360px; overflow-y: auto; white-space: pre; }
.copy { font: inherit; font-size: .8em; background: transparent; color: var(--accent); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-top: 8px; }

/* overview */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 28px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; text-decoration: none; color: inherit; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .qn { font-family: var(--font-mono); font-size: .85em; color: var(--muted); }
.card .metric { font-size: 2rem; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .metric small { font-size: .45em; color: var(--muted); font-weight: 400; margin-left: 4px; }
.card p { margin: 0; color: var(--muted); font-size: .92em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--rule); }
.stat b { display: block; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .86em; }

/* bars */
.group { margin: 0 0 22px; }
.group h3 { margin-bottom: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 8px 14px; align-items: center; padding: 5px 0; }
.bar-row .lab { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--neutral-soft); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 5px; }
.bar.alt > i { background: var(--muted); opacity: .55; }
.bar.hidden { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; min-width: 7.5em; font-size: .9em; }
.bar-row .val small { color: var(--muted); }
.pair { display: grid; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84em; color: var(--muted); margin: 0 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.pill { display: inline-block; font-size: .72em; font-weight: 600; padding: 1px 8px; border-radius: 99px; vertical-align: 2px; margin-left: 6px; }

/* stacked */
.stack { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: var(--neutral-soft); }
.stack > span { display: flex; align-items: center; justify-content: center; font-size: .78em; font-weight: 600; color: var(--surface); font-variant-numeric: tabular-nums; min-width: 0; }
.stack .s-high { background: var(--accent); }
.stack .s-poss { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); color: var(--fg); }
.stack .s-low { background: var(--neutral-soft); color: var(--fg); }
.stack .s-hid { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); color: var(--fg); flex: 1; }
.srow { display: grid; grid-template-columns: minmax(120px, 28%) 1fr; gap: 6px 16px; align-items: center; padding: 8px 0; }
.srow .lab small { display: block; color: var(--muted); }

/* heatmap */
.heat { display: grid; gap: 4px; margin: 6px 0 4px; }
.heat .hh { font-size: .84em; color: var(--muted); padding: 4px 6px; align-self: end; line-height: 1.3; }
.heat .rh { font-size: .9em; padding: 6px 8px 6px 0; align-self: center; line-height: 1.3; }
.cell { border-radius: 8px; padding: 12px 8px; text-align: center; min-height: 68px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; }
.cell b { font-size: 1.25rem; font-weight: 600; line-height: 1.1; }
.cell span { font-size: .76em; opacity: .85; }
.cell.hid { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); color: var(--fg); }
.scale { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .8em; color: var(--muted); }
.scale i { display: block; width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--heat-lo), var(--heat-hi)); }

/* tables */
.tbl-wrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9em; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: .86em; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .hid { color: var(--muted); }

/* findings list */
.finds { list-style: none; padding: 0; margin: 0; }
.finds li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.finds li:last-child { border-bottom: 0; }
.finds .meta { color: var(--muted); font-size: .84em; grid-column: 1; }

.limits { padding-left: 1.2em; margin: 8px 0; max-width: 78ch; }
.limits li { margin: 6px 0; }
.defs { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 20px; max-width: 900px; }
.defs dt { font-weight: 500; }
.defs dd { margin: 0; color: var(--muted); }
.note { color: var(--muted); font-size: .86em; max-width: 78ch; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 6px 9px; border-radius: 7px; max-width: 260px; opacity: 0; transition: opacity .1s; }
footer.page-foot { border-top: 1px solid var(--rule); padding-block: 22px 40px; color: var(--muted); font-size: .84em; }
@media (max-width: 560px) {
  .bar-row { grid-template-columns: 1fr auto; }
  .bar-row .lab { grid-column: 1 / -1; }
  .bar-row .bar { grid-column: 1; }
  .srow { grid-template-columns: 1fr; }
  .defs { grid-template-columns: 1fr; gap: 2px; }
  .defs dd { margin-bottom: 10px; }
  main { padding-block: 28px 56px; }
}
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
<!--BODY-->
<div id="app" data-lang="both">
  <header class="top"><div class="wrap top-in">
    <div class="brand">BHES <small id="brand-sub"></small></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="th" id="b-th">ไทย</button><button type="button" data-l="en" id="b-en">EN</button><button type="button" data-l="both" id="b-both">ไทย·EN</button></div>
  </div></header>
  <main class="wrap" id="view" tabindex="-1"></main>
  <footer class="page-foot"><div class="wrap" id="foot"></div></footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
const D = /*DATA*/;
(function () {
  "use strict";
  var app = document.getElementById("app"), view = document.getElementById("view");

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function bi(th, en) { if (th === en) return th; return '<span class="th">' + th + '</span><span class="en">' + en + "</span>"; }
  function bil(th, en) { return '<span class="inl">' + bi(th, en) + "</span>"; }
  function T(o) { return bi(o[0], o[1]); }
  function Q(id) { return D.q[id] ? D.q[id].rows : []; }
  function isHid(v) { return v === "<5"; }
  function nv(v) { return (v === undefined || v === "" || isHid(v)) ? null : parseFloat(v); }
  function fmt(v, d) { return v === null ? "–" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function by(rows, key, val) { return rows.filter(function (r) { return r[key] === val; })[0]; }
  function sig(match) { return D.sig.filter(function (r) { return r.comparison.indexOf(match) >= 0; })[0]; }
  function pstr(p) { return p < 0.001 ? "p < 0.001" : "p = " + Number(p).toFixed(3); }
  function dq(item) { var r = by(Q("DQ"), "item", item); return r ? r.value : "–"; }

  /* ---------- tooltip ---------- */
  var tip = document.getElementById("tip");
  function showTip(el) {
    var t = el.getAttribute("data-tip"); if (!t) return;
    tip.textContent = t; tip.style.opacity = "1";
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.style.opacity = "0"; }
  document.addEventListener("mouseover", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el); });
  document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest("[data-tip]")) hideTip(); });
  document.addEventListener("focusin", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el); });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]"); if (el) { showTip(el); setTimeout(hideTip, 2500); }
    var c = e.target.closest && e.target.closest(".copy");
    if (c) copySql(c);
  });
  function copySql(btn) {
    var pre = btn.parentNode.querySelector("pre"); if (!pre) return;
    var ok = function () { btn.textContent = btn.getAttribute("data-done"); setTimeout(function () { btn.textContent = btn.getAttribute("data-label"); }, 1600); };
    var sel = function () { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(pre.textContent).then(ok, sel); } catch (err) { sel(); }
  }

  /* ---------- building blocks ---------- */
  function src(ids) {
    return ids.map(function (id) { var q = D.q[id]; return q ? '<span class="src">' + esc(id) + " · " + esc(q.file) + "</span>" : ""; }).join("");
  }
  function sqlBlock(ids) {
    return ids.map(function (id) {
      var q = D.q[id]; if (!q) return "";
      return '<details class="sql"><summary>' + bil("ดู SQL ", "View SQL ") + esc(id) + '</summary><div><pre>' + esc(q.sql) + '</pre><button type="button" class="copy" data-label="Copy" data-done="Copied">Copy</button></div></details>';
    }).join("");
  }
  function panel(o) {
    return '<section class="panel" id="' + o.id + '"><h2>' + T(o.title) + '</h2>' + (o.lead ? '<p class="lead">' + T(o.lead) + "</p>" : "") + o.body +
      '<div class="foot"><span>' + bil("ที่มา ", "Source ") + "</span>" + src(o.ids) + '<span>· ' + bil("ช่องที่ซ่อนแสดงเป็นลาย &lt;5", "hidden cells are hatched, &lt;5") + "</span></div>" + sqlBlock(o.ids) + "</section>";
  }
  function barRow(label, pct, n, extra, alt) {
    var hid = pct === null, tipTxt = hid ? "<5" : (fmt(pct, 1) + "%" + (n ? " · n = " + n : ""));
    return '<div class="bar-row"><div class="lab">' + label + '</div><div class="bar' + (hid ? " hidden" : "") + (alt ? " alt" : "") + '" tabindex="0" data-tip="' + esc(tipTxt) + '">' +
      (hid ? "" : '<i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i>') + '</div><div class="val">' +
      (hid ? '<span class="hid">&lt;5</span>' : "<b>" + fmt(pct, 1) + "%</b>") + ' <small>' + (n ? "n=" + esc(n) : "") + (extra || "") + "</small></div></div>";
  }
  function pill(text, cls) { return '<span class="pill ' + cls + '">' + text + "</span>"; }
  function legend(items) { return '<div class="legend">' + items.map(function (i) { return '<span><i style="background:' + i[0] + '"></i>' + i[1] + "</span>"; }).join("") + "</div>"; }
  function table(head, rows) {
    return '<div class="tbl-wrap"><table><thead><tr>' + head.map(function (h) { return '<th class="' + (h.r ? "r" : "") + '">' + h.t + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) { return "<tr>" + r.map(function (c, i) { return '<td class="' + (head[i].r ? "r" : "") + '">' + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
  }
  function cellVal(v, d, suffix) { return isHid(v) ? '<span class="hid">&lt;5</span>' : fmt(nv(v), d) + (suffix || ""); }
  function heat(rowsKeys, colsKeys, get, rowHead, colHead, unit) {
    var vals = []; rowsKeys.forEach(function (r) { colsKeys.forEach(function (c) { var g = get(r, c); if (g && g.v !== null) vals.push(g.v); }); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), cols = colsKeys.length;
    var html = '<div class="heat" style="grid-template-columns:minmax(110px,26%) repeat(' + cols + ',minmax(0,1fr))"><div></div>';
    colsKeys.forEach(function (c) { html += '<div class="hh">' + colHead(c) + "</div>"; });
    rowsKeys.forEach(function (r) {
      html += '<div class="rh">' + rowHead(r) + "</div>";
      colsKeys.forEach(function (c) {
        var g = get(r, c);
        if (!g || g.v === null) { html += '<div class="cell hid" tabindex="0" data-tip="&lt;5"><b>&lt;5</b></div>'; return; }
        var t = hi === lo ? 0.5 : (g.v - lo) / (hi - lo), mix = Math.round(t * 100);
        var dark = t > 0.5;
        html += '<div class="cell" tabindex="0" data-tip="' + esc(g.tip) + '" style="background:color-mix(in srgb, var(--heat-hi) ' + mix + '%, var(--heat-lo));color:' + (dark ? "var(--surface)" : "var(--fg)") + '"><b>' + g.main + "</b><span>" + g.sub + "</span></div>";
      });
    });
    return html + '</div><div class="scale"><span>' + fmt(lo, unit === "%" ? 0 : 1) + (unit || "") + '</span><i></i><span>' + fmt(hi, unit === "%" ? 0 : 1) + (unit || "") + "</span></div>";
  }
  function verdict(cls, th, en) { return '<div class="verdict ' + cls + '">' + bi(th, en) + "</div>"; }

  /* ---------- derived numbers (all from the CSV tables) ---------- */
  var sWood = sig("ผนังไม้"), sVent = sig("ระบายอากาศ"), sRoof = sig("หลังคา"), sCeil = sig("ไม่มีฝ้า"), sComm = sig("หลังแฟลต"),
    sCope = sig("รับมือ"), sAir = sig("ไม่มีแอร์"), sInc = sig("ไม่เกิน 10,000 vs มากกว่า 10,000");
  var q31 = Q("Q3.1")[0] || {};
  var top6 = Q("Q3.6").filter(function (r) { return r.risk_group === "ลำดับต้น (rank<=20)" && r.burden_class === "high"; })[0] || {};
  top6.pct_high = top6.pct_of_group;

  /* ---------- pages ---------- */
  function pageOverview() {
    var card = function (href, qn, verdictHtml, th, en, metric, unit, sub) {

    }).join("");

    var factors = [["Q3.7", "tenure", bi("เช่า/เจ้าของ (A14)", "Tenure (A14)")], ["Q3.8", "b12_no_budget", bi("ไม่มีงบประมาณ (B12)", "No budget (B12)")], ["Q3.9", "income_ord", bi("ชั้นรายได้", "Income band")],

      ["Q3.12", "b12_limited_space", bi("พื้นที่จำกัด (B12)", "Limited space (B12)")], ["Q3.13", "b12_dont_know_how", bi("ไม่รู้จะปรับอย่างไร (B12)", "Don't know how (B12)")]];
    var retro = factors.map(function (f) {
      return '<div class="group"><h3>' + f[2] + '</h3><div class="tbl-wrap"><table><thead><tr><th>' + bi("กลุ่ม", "Group") + '</th><th class="r">n</th><th class="r">' + bi("เคยปรับปรุง", "Retrofitted") + '</th><th class="r">%</th></tr></thead><tbody>' +
        Q(f[0]).map(function (r) { return "<tr><td>" + esc(r[f[1]]) + '</td><td class="r">' + cellVal(r.n, 0) + '</td><td class="r">' + cellVal(r.n_retrofit_yes, 0) + '</td><td class="r">' + cellVal(r.pct_retrofit_yes, 1) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    }).join("");

    return '<div class="q-head"><div><div class="eyebrow">Q3 · Household Support Prioritisation</div><h1>' + bi("ครัวเรือนกลุ่มใดควรได้รับการช่วยเหลือก่อน", "Which households should be supported first?") + "</h1></div>" +
      verdict("v-warn", "สนับสนุนบางส่วน", "Partly supported") + "</div>" +
      '<div class="answer"><p class="big">' + bi("กลุ่มลำดับต้น " + esc(q31.n_top_weighted) + " บ้านคือรายได้ต่ำที่ภาระค่าไฟสูงทั้งกลุ่ม (" + esc(top6.pct_high) + "%) และเป็นชุดเดียวกันทั้งแบบน้ำหนักค่าไฟ ×2 และน้ำหนักเท่ากัน ส่วนคำถามว่าปัจจัยใดทำให้ปรับปรุงบ้านได้ ข้อมูลยังไม่พอ",
        "The " + esc(q31.n_top_weighted) + " top-ranked homes are low-income with a high bill burden throughout (" + esc(top6.pct_high) + "%), and the set is identical with the bill weighted ×2 or equally. What makes a retrofit possible cannot yet be answered from this sample.") + "</p>" +
      "<p>" + bi("คะแนนความเสี่ยง = ผลกระทบความร้อน/13 + สภาพบ้าน/5 + 2 × ภาระค่าไฟ + ความจำกัดในการรับมือ/6 อันดับเท่ากันได้อันดับเดียวกัน จึงมี 21 บ้านที่อันดับ 1–20", "Risk score = heat impact/13 + housing/5 + 2 × bill burden + coping limits/6. Ties share a rank, hence 21 homes in ranks 1–20.") + "</p></div>" +
      panel({ id: "q3-profile", ids: ["Q3.2", "Q3.3", "Q3.4", "Q3.5", "Q3.6"], title: ["ลักษณะของกลุ่มลำดับต้น เทียบกับที่เหลือ", "Top-ranked group versus the rest"],
        lead: ["% ของแต่ละกลุ่มที่มีลักษณะนั้น กลุ่มลำดับต้นมี " + esc(q31.n_top_weighted) + " บ้าน ที่เหลือ " + (nv(q31.n_ranked) - nv(q31.n_top_weighted)) + " บ้าน", "% of each group with the trait. The top group has " + esc(q31.n_top_weighted) + " homes, the rest " + (nv(q31.n_ranked) - nv(q31.n_top_weighted)) + "."],
        body: prof }) +
      panel({ id: "q3-weights", ids: ["Q3.1"], title: ["ลำดับต้นขึ้นกับน้ำหนักค่าไฟไหม", "Does the top group depend on the bill weight"],
        lead: ["จำนวนบ้านที่อยู่ลำดับต้นเมื่อถ่วงน้ำหนักค่าไฟ ×2 และเมื่อน้ำหนักเท่ากัน", "Homes ranked at the top with the bill weighted ×2 and with equal weights."],
        body: table([{ t: bi("แบบน้ำหนัก", "Weighting") }, { t: bi("บ้านลำดับต้น", "Top-ranked homes"), r: 1 }], [[bi("ค่าไฟ ×2 (D7)", "Bill ×2 (D7)"), esc(q31.n_top_weighted)], [bi("น้ำหนักเท่ากัน", "Equal weights"), esc(q31.n_top_equal)], [bi("อยู่ในทั้งสองแบบ", "In both"), esc(q31.n_top_both)]]) }) +
      panel({ id: "q3-retrofit", ids: ["Q3.7", "Q3.8", "Q3.9", "Q3.10", "Q3.11", "Q3.12", "Q3.13"], title: ["ปัจจัยที่ทำให้ปรับปรุงบ้านลดความร้อนได้", "What makes a heat retrofit possible"],
        lead: ["บ้านที่เคยปรับปรุงมีเพียง 11 จาก 88 หลัง ส่วนใหญ่ของตารางจึงถูกซ่อน (&lt;5) ยังสรุปปัจจัยไม่ได้", "Only 11 of 88 homes ever retrofitted, so most cells are hidden (&lt;5). No factor can be concluded yet."], body: retro });
  }

  function pageMethod() {
    var all = Object.keys(D.q).filter(function (k) { return k !== "DQ"; });
    var idx = table([{ t: bi("คำสั่ง", "Statement") }, { t: bi("เรื่อง", "Topic") }, { t: bi("ไฟล์ผลลัพธ์", "Result file") }],
      all.map(function (id) { return ['<span class="mono">' + esc(id) + "</span>", esc(D.q[id].title), '<span class="mono">' + esc(D.q[id].file) + "</span>"]; }));
    return '<div class="eyebrow">' + bil("วิธีการและข้อจำกัด", "Method and limits") + "</div><h1>" + bi("ตัวเลขมาจากไหน และเชื่อถือได้แค่ไหน", "Where the numbers come from, and how far to trust them") + "</h1>" +
      '<section class="panel"><h2>' + bi("นิยาม", "Definitions") + '</h2><dl class="defs">' +
      "<dt>" + bi("ผลกระทบความร้อนสูง", "High heat impact") + "</dt><dd>" + bi("คะแนน 8–13 จาก 13: ความถี่ร้อน (0–3) + อาการ 5 ข้อ + ผลต่อรายได้ (0–2) + สุขภาพ (0–1) + ความเครียด (0–2)", "Score 8–13 of 13: heat frequency (0–3) + five symptoms + income effect (0–2) + health (0–1) + stress (0–2).") + "</dd>" +
      "<dt>" + bi("ภาระค่าไฟ", "Bill burden") + "</dt><dd>" + bi("ค่าไฟหน้าร้อน ÷ รายได้/เดือน เป็นช่วงต่ำสุด–สูงสุด “สูง” คือช่วงต่ำสุด ≥ 10% (ทดสอบที่ 6% ด้วย) ช่วงปลายเปิดใช้เพดาน 2,500 / 100,000 (รายได้) และ 6,000 (ค่าไฟ)", "Summer bill ÷ monthly income as a low–high range. “High” = lowest end ≥ 10% (6% also tested). Open-ended bands use caps of 2,500 / 100,000 (income) and 6,000 (bill).") + "</dd>" +
      "<dt>" + bi("คะแนนความเสี่ยง", "Risk score") + "</dt><dd>" + bi("ผลกระทบความร้อน/13 + สภาพบ้าน/5 + 2 × ภาระค่าไฟ + ความจำกัดในการรับมือ/6 (เทียบกับน้ำหนักเท่ากันเสมอ)", "Heat/13 + housing/5 + 2 × bill + coping/6, always reported next to equal weights.") + "</dd>" +
      "<dt>" + bi("การซ่อนเซลล์", "Cell suppression") + "</dt><dd>" + bi("จำนวนที่เป็น 1–4 บ้านแสดงเป็น &lt;5 ถ้าแถวมีค่าที่ถูกซ่อน จะซ่อนทั้งแถวและซ่อนแถวที่เล็กที่สุดถัดไป กันการคำนวณย้อนจากยอดรวม", "Counts of 1–4 show as &lt;5. If a row has a hidden value the whole row is hidden, and so is the next-smallest row, so totals cannot reveal it.") + "</dd></dl></section>" +
      '<section class="panel"><h2>' + bi("ข้อจำกัด", "Limitations") + '</h2><ol class="limits">' +
      "<li>" + bi("88 ครัวเรือนจาก 2 ชุมชน ความต่างระหว่างกลุ่มย่อยจึงไม่แน่นอนมาก ทดสอบหลายครั้งโดยไม่ปรับค่า p", "88 households from 2 communities, so subgroup differences are very uncertain; many tests, no p correction.") + "</li>" +
      "<li>" + bi("ตัวแปรอธิบายบางตัวแทบไม่แปรผัน (ไม่มีฉนวน 81/88, ร้อนมากทุกวัน 68/88)", "Some explanatory variables barely vary (no insulation 81/88, very hot every day 68/88).") + "</li>" +
      "<li>" + bi("ผลกระทบความร้อนและน้ำท่วมสอดคล้องกันสูง แยกผลทางสถิติได้ยาก", "Heat and flood impacts answer alike, so they are hard to separate statistically.") + "</li>" +
      "<li>" + bi("คำตอบรายงานเองและถามย้อนหลัง สัมภาษณ์ช่วงฤดูฝน แต่ถามค่าไฟหน้าร้อน", "Self-reported and recalled; interviewed in the rainy season but asked about summer bills.") + "</li>" +
      "<li>" + bi("รายได้และค่าไฟเป็นช่วง ภาระจึงเป็นช่วง เกณฑ์ 10% มาจากเกณฑ์ต่างประเทศ ไม่ใช่เกณฑ์ไทย", "Income and bills are bands, so burden is a range; the 10% line comes from international benchmarks, not Thai ones.") + "</li>" +
      "<li>" + bi("“มีแอร์” ไม่บอกชั่วโมงการใช้", "“Has an air conditioner” does not say how long it runs.") + "</li>" +
      "<li>" + bi("ผลเป็นความสัมพันธ์ ไม่ใช่เหตุและผล ไม่ได้ใช้ข้อมูล SoVI หรือ Landsat ในข้อสรุป", "Results are associations, not causes; SoVI and Landsat data are not used in the conclusions.") + "</li></ol></section>" +
      '<section class="panel"><h2>' + bi("การตรวจสอบ", "Verification") + '</h2><p class="lead">' + bi("ผล Athena ถูกคำนวณซ้ำจากไฟล์ดิบด้วยโค้ดแยกจาก pipeline เทียบ " + esc(D.meta.compared) + " เซลล์ที่แสดงอยู่ ต่างกัน 0 เซลล์ และไม่พบเซลล์ 1–4 หลุดในผลลัพธ์", "Athena results were recomputed from the raw file with code separate from the pipeline: " + esc(D.meta.compared) + " visible cells compared, 0 differences, and no 1–4 cell leaked into the outputs.") + "</p>" +
      '<p class="note">' + bi("รันเมื่อ ", "Run on ") + esc(D.meta.runDate) + " · workgroup bhes-wg · ap-southeast-1 · " + bi("ตารางสร้างจาก Parquet ใน S3 curated/", "table built from Parquet in S3 curated/") + "</p></section>" +
      '<section class="panel"><h2>' + bi("คำสั่ง SQL ทั้งหมด", "All SQL statements") + "</h2>" + idx + "</section>" +
      '<section class="panel"><h2>' + bi("อัปเดตหน้านี้", "Refreshing this page") + '</h2><p class="lead">' + bi("รัน analytics/run_athena.py แล้วรัน dashboard/build.py ตัวเลขทุกตัวอ่านจากไฟล์ CSV ไม่ได้พิมพ์เอง", "Run analytics/run_athena.py, then dashboard/build.py. Every number is read from the CSV files, none is typed by hand.") + "</p></section>";
  }

  /* ---------- router ---------- */

  function setLang(l) {

  setLang(["th", "en", "both"].indexOf(saved) >= 0 ? saved : "both");
  window.addEventListener("hashchange", route);
  route();
})();
