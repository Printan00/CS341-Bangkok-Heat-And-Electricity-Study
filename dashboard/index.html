<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHES Heat & Electricity Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Q1-Q3 findings of the Happy Home survey from Amazon Athena: heat vulnerability, electricity burden and support priority.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* Layout concept: quiet single column, one accent (teal), whitespace and hairlines instead of cards; one page per research question. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #14181d;
  --muted: #5b6470;
  --rule: #e2e5ea;
  --accent: #0d6e73;
  --accent-soft: #dbeeee;
  --heat-lo: #eaf4f4;
  --heat-hi: #0b5559;
  --good: #1a7a48;
  --good-soft: #dff2e7;
  --warn: #a35f00;
  --warn-soft: #fbeccf;
  --bad: #b03a31;
  --bad-soft: #f8e1de;
  --neutral-soft: #e9ebef;
  --hatch: #c7ccd4;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #141a20; --fg: #e8ecf1; --muted: #9aa5b3; --rule: #242c35;
    --accent: #4cbfc4; --accent-soft: #173538; --heat-lo: #12282b; --heat-hi: #5ccfd4;
    --good: #5dcf92; --good-soft: #173626; --warn: #e5a54a; --warn-soft: #3a2c12;
    --bad: #ef8a80; --bad-soft: #3d1f1c; --neutral-soft: #202830; --hatch: #3a4450;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #141a20; --fg: #e8ecf1; --muted: #9aa5b3; --rule: #242c35;
  --accent: #4cbfc4; --accent-soft: #173538; --heat-lo: #12282b; --heat-hi: #5ccfd4;
  --good: #5dcf92; --good-soft: #173626; --warn: #e5a54a; --warn-soft: #3a2c12;
  --bad: #ef8a80; --bad-soft: #3d1f1c; --neutral-soft: #202830; --hatch: #3a4450;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
#app { min-height: 100vh; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }

/* language switch: th | en | both */
#app[data-lang="th"] .en { display: none; }
#app[data-lang="en"] .th { display: none; }
#app[data-lang="both"] .en { display: block; color: var(--muted); font-size: .84em; font-weight: 400; line-height: 1.45; }
#app[data-lang="both"] .inl .en { display: inline; }
#app[data-lang="both"] .inl .en::before { content: " · "; }

/* header */
.top { border-bottom: 1px solid var(--rule); background: var(--surface); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); font-size: .8em; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; line-height: 1.3; }
.nav a:hover { color: var(--fg); background: var(--neutral-soft); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav a:focus-visible, .lang button:focus-visible, summary:focus-visible, .copy:focus-visible, .cell:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.lang button { font: inherit; font-size: .82em; background: transparent; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* page */
main { padding-block: 40px 72px; }
.eyebrow { font-size: .78em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.25; font-weight: 600; margin: 8px 0 12px; text-wrap: balance; }
h2 { font-size: 1.25rem; line-height: 1.35; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; }
.lead { color: var(--muted); max-width: 68ch; margin: 0 0 8px; }
.q-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.verdict { display: inline-flex; flex-direction: column; gap: 0; padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: .92em; line-height: 1.35; }
.verdict .en { font-weight: 400; }
.v-good { background: var(--good-soft); color: var(--good); }
.v-warn { background: var(--warn-soft); color: var(--warn); }
.v-bad { background: var(--bad-soft); color: var(--bad); }
.v-neutral { background: var(--neutral-soft); color: var(--muted); }
.answer { margin: 20px 0 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.answer p { margin: 0 0 6px; max-width: 72ch; }
.answer .big { font-size: 1.05rem; font-weight: 500; }

.panel { padding-block: 36px 8px; border-top: 1px solid var(--rule); margin-top: 28px; }
.panel:first-of-type { margin-top: 20px; }
.panel .lead { margin-bottom: 18px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 14px; font-size: .8em; color: var(--muted); }
.foot .src { font-family: var(--font-mono); }
details.sql { margin-top: 10px; }
details.sql summary { cursor: pointer; color: var(--accent); font-size: .85em; font-weight: 500; width: fit-content; }
details.sql pre { margin: 10px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; max-height: 360px; overflow-y: auto; white-space: pre; }
.copy { font: inherit; font-size: .8em; background: transparent; color: var(--accent); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-top: 8px; }

/* overview */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 28px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; text-decoration: none; color: inherit; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .qn { font-family: var(--font-mono); font-size: .85em; color: var(--muted); }
.card .metric { font-size: 2rem; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .metric small { font-size: .45em; color: var(--muted); font-weight: 400; margin-left: 4px; }
.card p { margin: 0; color: var(--muted); font-size: .92em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--rule); }
.stat b { display: block; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .86em; }

/* bars */
.group { margin: 0 0 22px; }
.group h3 { margin-bottom: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 8px 14px; align-items: center; padding: 5px 0; }
.bar-row .lab { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--neutral-soft); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 5px; }
.bar.alt > i { background: var(--muted); opacity: .55; }
.bar.hidden { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; min-width: 7.5em; font-size: .9em; }
.bar-row .val small { color: var(--muted); }
.pair { display: grid; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84em; color: var(--muted); margin: 0 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.pill { display: inline-block; font-size: .72em; font-weight: 600; padding: 1px 8px; border-radius: 99px; vertical-align: 2px; margin-left: 6px; }

/* stacked */
.stack { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: var(--neutral-soft); }
.stack > span { display: flex; align-items: center; justify-content: center; font-size: .78em; font-weight: 600; color: var(--surface); font-variant-numeric: tabular-nums; min-width: 0; }
.stack .s-high { background: var(--accent); }
.stack .s-poss { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); color: var(--fg); }
.stack .s-low { background: var(--neutral-soft); color: var(--fg); }
.stack .s-hid { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); color: var(--fg); flex: 1; }
.srow { display: grid; grid-template-columns: minmax(120px, 28%) 1fr; gap: 6px 16px; align-items: center; padding: 8px 0; }
.srow .lab small { display: block; color: var(--muted); }

/* heatmap */
.heat { display: grid; gap: 4px; margin: 6px 0 4px; }
.heat .hh { font-size: .84em; color: var(--muted); padding: 4px 6px; align-self: end; line-height: 1.3; }
.heat .rh { font-size: .9em; padding: 6px 8px 6px 0; align-self: center; line-height: 1.3; }
.cell { border-radius: 8px; padding: 12px 8px; text-align: center; min-height: 68px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; }
.cell b { font-size: 1.25rem; font-weight: 600; line-height: 1.1; }
.cell span { font-size: .76em; opacity: .85; }
.cell.hid { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); color: var(--fg); }
.scale { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .8em; color: var(--muted); }
.scale i { display: block; width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--heat-lo), var(--heat-hi)); }

/* tables */
.tbl-wrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9em; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: .86em; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .hid { color: var(--muted); }

/* findings list */
.finds { list-style: none; padding: 0; margin: 0; }
.finds li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.finds li:last-child { border-bottom: 0; }
.finds .meta { color: var(--muted); font-size: .84em; grid-column: 1; }

.limits { padding-left: 1.2em; margin: 8px 0; max-width: 78ch; }
.limits li { margin: 6px 0; }
.defs { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 20px; max-width: 900px; }
.defs dt { font-weight: 500; }
.defs dd { margin: 0; color: var(--muted); }
.note { color: var(--muted); font-size: .86em; max-width: 78ch; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 6px 9px; border-radius: 7px; max-width: 260px; opacity: 0; transition: opacity .1s; }
footer.page-foot { border-top: 1px solid var(--rule); padding-block: 22px 40px; color: var(--muted); font-size: .84em; }
@media (max-width: 560px) {
  .bar-row { grid-template-columns: 1fr auto; }
  .bar-row .lab { grid-column: 1 / -1; }
  .bar-row .bar { grid-column: 1; }
  .srow { grid-template-columns: 1fr; }
  .defs { grid-template-columns: 1fr; gap: 2px; }
  .defs dd { margin-bottom: 10px; }
  main { padding-block: 28px 56px; }
}
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
html{color-scheme:light dark}body{margin:0}</style>
</head>
<body>
<div id="app" data-lang="both">
  <header class="top"><div class="wrap top-in">
    <div class="brand">BHES <small id="brand-sub"></small></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="th" id="b-th">ไทย</button><button type="button" data-l="en" id="b-en">EN</button><button type="button" data-l="both" id="b-both">ไทย·EN</button></div>
  </div></header>
  <main class="wrap" id="view" tabindex="-1"></main>
  <footer class="page-foot"><div class="wrap" id="foot"></div></footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
const D = {"meta":{"runDate":"2026-11-12","compared":198},"q":{"Q1.1":{"title":"ลักษณะบ้านรายข้อ x ผลกระทบความร้อนสูง (heat_impact_level = high) เทียบไม่สูง (low/medium) รวม 2 ชุมชน; กลุ่มเล็กรวมเป็นหมวด (ดูชื่อหมวด)","file":"q1/Q1_1.csv","sql":"-- Q1.1 ลักษณะบ้านรายข้อ x ผลกระทบความร้อนสูง (heat_impact_level = high) เทียบไม่สูง (low/medium) รวม 2 ชุมชน; กลุ่มเล็กรวมเป็นหมวด (ดูชื่อหมวด)\nWITH base AS (\n  SELECT 'B4 หลังคา' AS feature, CASE WHEN b4_roof_material_clean = 'สังกะสี/เมทัลชีท' THEN 'สังกะสี/เมทัลชีท' ELSE 'กระเบื้อง/คอนกรีต/อื่น ๆ/ไม่ระบุ (รวม)' END AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B3 วัสดุผนัง' AS feature, CASE WHEN b3_wall_material_clean = 'ไม้' THEN 'ไม้' WHEN b3_wall_material_clean = 'คอนกรีต' THEN 'คอนกรีต' ELSE 'ผสม/สังกะสี/อื่น ๆ/ไม่ระบุ (รวม)' END AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B6 ฝ้าเพดาน' AS feature, CASE WHEN b6_ceiling_clean = 'ไม่มี' THEN 'ไม่มีฝ้า' ELSE 'มีฝ้า/ไม่แน่ใจ (รวม)' END AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B7 ฉนวน' AS feature, CASE WHEN b7_insulation_clean = 'ไม่มี' THEN 'ไม่มีฉนวน' ELSE 'มีฉนวน/ไม่แน่ใจ (รวม)' END AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B8 ระบายอากาศ' AS feature, coalesce(b8_ventilation_clean, '(ไม่ระบุ/ไม่แน่ใจ)') AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B9 ร่มเงา' AS feature, coalesce(b9_shade_clean, '(ไม่ระบุ/ไม่แน่ใจ)') AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n    UNION ALL\n    SELECT 'B1 ประเภทที่อยู่' AS feature, CASE WHEN b1_housing_type_clean IN ('บ้านเดี่ยว', 'บ้านแถว/ทาวน์เฮาส์') THEN b1_housing_type_clean ELSE 'ห้องเช่า/แฟลต/ชั่วคราว/อื่น ๆ (รวม)' END AS level, heat_impact_level, heat_impact_score FROM bhes.happy_home_household WHERE usable_q1\n), cells0 AS (\n  SELECT feature AS feature, level AS level,\n    count(*) AS n,\n    count_if(heat_impact_level = 'high') AS c_high,\n    count_if(heat_impact_level IN ('low', 'medium')) AS c_not_high,\n    count_if(heat_impact_level IS NULL) AS c_heat_missing,\n    avg(heat_impact_score) AS avg_score\n  FROM base\n  GROUP BY 1, 2\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER (PARTITION BY feature) AS n_hidden,\n  ROW_NUMBER() OVER (PARTITION BY feature ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, feature, level) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT feature, level,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(c_not_high AS varchar) ELSE '<5' END AS n_not_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_not_high / n, 1) AS varchar) ELSE '<5' END AS pct_not_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(c_heat_missing AS varchar) ELSE '<5' END AS n_heat_missing,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_not_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_heat_missing / n, 1) AS varchar) ELSE '<5' END AS pct_heat_missing,\n  CASE WHEN NOT sup THEN CAST(ROUND(avg_score, 2) AS varchar) ELSE '<5' END AS avg_heat_score\nFROM flagged\nORDER BY feature, level;","rows":[{"feature":"B1 ประเภทที่อยู่","level":"บ้านเดี่ยว","n":"62","n_high":"20","pct_high":"32.3","n_not_high":"42","pct_not_high":"67.7","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"6.58"},{"feature":"B1 ประเภทที่อยู่","level":"บ้านแถว/ทาวน์เฮาส์","n":"17","n_high":"8","pct_high":"47.1","n_not_high":"9","pct_not_high":"52.9","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"6.71"},{"feature":"B1 ประเภทที่อยู่","level":"ห้องเช่า/แฟลต/ชั่วคราว/อื่น ๆ (รวม)","n":"9","n_high":"0","pct_high":"0.0","n_not_high":"9","pct_not_high":"100.0","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"4.67"},{"feature":"B3 วัสดุผนัง","level":"คอนกรีต","n":"22","n_high":"5","pct_high":"22.7","n_not_high":"17","pct_not_high":"77.3","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"6.09"},{"feature":"B3 วัสดุผนัง","level":"ผสม/สังกะสี/อื่น ๆ/ไม่ระบุ (รวม)","n":"29","n_high":"6","pct_high":"20.7","n_not_high":"23","pct_not_high":"79.3","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"5.86"},{"feature":"B3 วัสดุผนัง","level":"ไม้","n":"37","n_high":"17","pct_high":"45.9","n_not_high":"20","pct_not_high":"54.1","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"7.03"},{"feature":"B4 หลังคา","level":"กระเบื้อง/คอนกรีต/อื่น ๆ/ไม่ระบุ (รวม)","n":"56","n_high":"17","pct_high":"30.4","n_not_high":"39","pct_not_high":"69.6","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"6.43"},{"feature":"B4 หลังคา","level":"สังกะสี/เมทัลชีท","n":"32","n_high":"11","pct_high":"34.4","n_not_high":"21","pct_not_high":"65.6","n_heat_missing":"0","pct_heat_missing":"0.0","avg_heat_score":"6.38"},{"feature":"B6 ฝ้าเพดาน","level":"มีฝ้า/ไม่แน่ใจ (รวม)","n igh BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_medium / n, 1) AS varchar) ELSE '<5' END AS pct_medium,\n  CASE WHEN (NOT sup AND NOT (c_low BETWEEN 1 AND 4 OR c_medium BETWEEN 1 AND 4 OR c_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_low BETWEEN 1 AND 4 OR c_medium BETWEEN 1 AND 4 OR c_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_low BETWEEN 1 AND 4 OR c_medium BETWEEN 1 AND 4 OR c_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(c_heat_missing AS varchar) ELSE '<5' END AS n_heat_missing,\n  CASE WHEN (NOT sup AND NOT (c_low BETWEEN 1 AND 4 OR c_medium BETWEEN 1 AND 4 OR c_high BETWEEN 1 AND 4 OR c_heat_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_heat_missing / n, 1) AS varchar) ELSE '<5' END AS pct_heat_missing\nFROM flagged\nORDER BY housing_risk_group;","rows":[{"housing_risk_group":"0-2","n":"37","n_low":"8","pct_low":"21.6","n_medium":"19","pct_medium":"51.4","n_high":"10","pct_high":"27.0","n_heat_missing":"0","pct_heat_missing":"0.0"},{"housing_risk_group":"3-5 (เสี่ยงสูง)","n":"51","n_low":"7","pct_low":"13.7","n_medium":"26","pct_medium":"51.0","n_high":"18","pct_high":"35.3","n_heat_missing":"0","pct_heat_missing":"0.0"}]},"Q1.6":{"title":"Heatmap: การระบายอากาศ (B8) x วัสดุผนัง (ไม้ เทียบ อื่น ๆ) -> คะแนนผลกระทบความร้อนเฉลี่ย (0-13) และจำนวนครัวเรือน","file":"q1/Q1_6.csv","sql":"-- Q1.6 Heatmap: การระบายอากาศ (B8) x วัสดุผนัง (ไม้ เทียบ อื่น ๆ) -> คะแนนผลกระทบความร้อนเฉลี่ย (0-13) และจำนวนครัวเรือน\n-- ทุกช่องมีมากกว่า 5 บ้าน ค่าเฉลี่ยของกลุ่มตั้งแต่ 5 บ้านขึ้นไปไม่เปิดเผยจำนวนเล็ก; ช่องที่ n < 5 แสดงเป็น '<5'\nWITH cells AS (\n  SELECT\n    coalesce(b8_ventilation_clean, '(ไม่ระบุ/ไม่แน่ใจ)') AS ventilation,\n    CASE WHEN b3_wall_material_clean = 'ไม้' THEN 'ไม้' ELSE 'อื่น ๆ (คอนกรีต/ผสม/สังกะสี/ไม่ระบุ)' END AS wall,\n    count(*) AS n,\n    avg(heat_impact_score) AS avg_score\n  FROM bhes.happy_home_household\n  WHERE usable_q1\n  GROUP BY 1, 2\n)\nSELECT ventilation, wall,\n  CASE WHEN n >= 5 THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN n >= 5 THEN CAST(ROUND(avg_score, 2) AS varchar) ELSE '<5' END AS avg_heat_score\nFROM cells\nORDER BY ventilation, wall;","rows":[{"ventilation":"ดี","wall":"อื่น ๆ (คอนกรีต/ผสม/สังกะสี/ไม่ระบุ)","n":"14","avg_heat_score":"4.86"},{"ventilation":"ดี","wall":"ไม้","n":"9","avg_heat_score":"5.44"},{"ventilation":"ปานกลาง","wall":"อื่น ๆ (คอนกรีต/ผสม/สังกะสี/ไม่ระบุ)","n":"10","avg_heat_score":"5.5"},{"ventilation":"ปานกลาง","wall":"ไม้","n":"9","avg_heat_score":"6.67"},{"ventilation":"ไม่ดี","wall":"อื่น ๆ (คอนกรีต/ผสม/สังกะสี/ไม่ระบุ)","n":"27","avg_heat_score":"6.7"},{"ventilation":"ไม่ดี","wall":"ไม้","n":"19","avg_heat_score":"7.95"}]},"Q2.1":{"title":"ชั้นรายได้ (A7) x ภาระค่าไฟหน้าร้อน (เกณฑ์ 10%)","file":"q2/Q2_1.csv","sql":"-- Q2.1 ชั้นรายได้ (A7) x ภาระค่าไฟหน้าร้อน (เกณฑ์ 10%)\nWITH base AS (\n  SELECT * FROM bhes.happy_home_household WHERE usable_q2\n), cells0 AS (\n  SELECT coalesce(income_ord, 0) AS income_ord, coalesce(a7_income_band_clean, '(ไม่ระบุ)') AS income_band,\n    count(*) AS n,\n    count_if(burden_class = 'high') AS c_high,\n    count_if(burden_class = 'possibly_high') AS c_possibly_high,\n    count_if(burden_class = 'low') AS c_low,\n    count_if(burden_class IS NULL) AS c_burden_missing,\n    min(burden_min) AS b_min_lo, approx_percentile(burden_min, 0.5) AS b_min_med, max(burden_max) AS b_max_hi,\n    approx_percentile(burden_max, 0.5) AS b_max_med\n  FROM base\n  GROUP BY 1, 2\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER () AS n_hidden,\n  ROW_NUMBER() OVER ( ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, income_ord, income_band) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT income_ord, income_band,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_possibly_high AS varchar) ELSE '<5' END AS n_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_possibly_high / n, 1) AS varchar) ELSE '<5' END AS pct_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_low AS varchar) ELSE '<5' END AS n_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_low / n, 1) AS varchar) ELSE '<5' END AS pct_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_burden_missing AS varchar) ELSE '<5' END AS n_burden_missing,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_burden_missing / n, 1) AS varchar) ELSE '<5' END AS pct_b R c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_possibly_high AS varchar) ELSE '<5' END AS n_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_possibly_high / n, 1) AS varchar) ELSE '<5' END AS pct_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_low AS varchar) ELSE '<5' END AS n_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_low / n, 1) AS varchar) ELSE '<5' END AS pct_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_burden_missing AS varchar) ELSE '<5' END AS n_burden_missing,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_burden_missing / n, 1) AS varchar) ELSE '<5' END AS pct_burden_missing\nFROM flagged\nORDER BY income_group;","rows":[{"income_group":"1) ไม่เกิน 10,000","n":"34","n_high":"27","pct_high":"79.4","n_possibly_high":"7","pct_possibly_high":"20.6","n_low":"0","pct_low":"0.0","n_burden_missing":"0","pct_burden_missing":"0.0"},{"income_group":"2) 10, "pct_of_income_group":"34.8"},{"income_group":"3) มากกว่า 20,000","bill_group":"1) ไม่เกิน 2,000","n":"15","pct_of_income_group":"48.4"},{"income_group":"3) มากกว่า 20,000","bill_group":"2) มากกว่า 2,000","n":"16","pct_of_income_group":"51.6"}]},"Q2.2":{"title":"ชั้นรายได้ x ภาระค่าไฟ ที่เกณฑ์ 6% (ทดสอบความไว D2)","file":"q2/Q2_2.csv","sql":"-- Q2.2 ชั้นรายได้ x ภาระค่าไฟ ที่เกณฑ์ 6% (ทดสอบความไว D2)\nWITH base AS (\n  SELECT * FROM bhes.happy_home_household WHERE usable_q2\n), cells0 AS (\n  SELECT coalesce(income_ord, 0) AS income_ord, coalesce(a7_income_band_clean, '(ไม่ระบุ)') AS income_band,\n    count(*) AS n,\n    count_if(burden_class_6pct = 'high') AS c_high,\n    count_if(burden_class_6pct = 'possibly_high') AS c_possibly_high,\n    count_if(burden_class_6pct = 'low') AS c_low,\n    count_if(burden_class_6pct IS NULL) AS c_burden_missing\n  FROM base\n  GROUP BY 1, 2\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER () AS n_hidden,\n  ROW_NUMBER() OVER ( ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, income_ord, income_band) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT income_ord, income_band,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_possibly_high AS varchar) ELSE '<5' END AS n_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_possibly_high / n, 1) AS varchar) ELSE '<5' END AS pct_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_low AS varchar) ELSE '<5' END AS n_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_low / n, 1) AS varchar) ELSE '<5' END AS pct_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_burden_missing AS varchar) ELSE '<5' END AS n_burden_missing,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_burden_missing / n, 1) AS varchar) ELSE '<5' END AS pct_burden_missing\nFROM flagged\nORDER BY income_ord, income_band;","rows":[{"income_ord":"1","income_band":"ต่ำกว่า 5,000 บาท","n":"20","n_high":"<5","pct_high":"<5","n_possibly_high":"<5","pct_possibly_high":"<5","n_low":"<5","pct_low":"<5","n_burden_missing":"<5","pct_burden_missing":"<5"},{"income_ord":"2","income_band":"5,001–10,000 บาท","n":"14","n_high":"8","pct_high":"57.1","n_possibly_high":"6","pct_possibly_high":"42.9","n_low":"0","pct_low":"0.0","n_burden_missing":"0","pct_burden_missing":"0.0"},{"income_ord":"3","income_band":"10,001–20,000 บาท","n":"23","n_high":"8","pct_high":"34.8","n_possibly_high":"15","pct_possibly_high":"65.2","n_low":"0","pct_low":"0.0","n_burden_missing":"0","pct_burden_missing":"0.0"},{"income_ord":"4","income_band":"20,001–50,000 บาท","n":"24","n_high":"<5","pct_high":"<5","n_possibly_high":"<5","pct_possibly_high":"<5","n_low":"<5","pct_low":"<5","n_burden_missing":"<5","pct_burden_missing":"<5"},{"income_ord":"5","income_band":"มากกว่า 50,000 บาท","n":"7","n_high":"<5","pct_high":"<5","n_possibly_high":"<5","pct_possibly_high":"<5","n_low":"<5","pct_low":"<5","n_burden_missing":"<5","pct_burden_missing":"<5"}]},"Q2.3":{"title":"การเข้าถึงการทำความเย็น: มีแอร์ (has_aircon) x ภาระค่าไฟ","file":"q2/Q2_3.csv","sql":"-- Q2.3 การเข้าถึงการทำความเย็น: มีแอร์ (has_aircon) x ภาระค่าไฟ\nWITH base AS (\n  SELECT * FROM bhes.happy_home_household WHERE usable_q2\n), cells0 AS (\n  SELECT coalesce(CAST(has_aircon AS varchar), '(null)') AS has_aircon,\n    count(*) AS n,\n    count_if(burden_class = 'high') AS c_high,\n    count_if(burden_class = 'possibly_high') AS c_possibly_high,\n    count_if(burden_class = 'low') AS c_low,\n    count_if(burden_class IS NULL) AS c_burden_missing,\n    min(burden_min) AS b_min_lo, approx_percentile(burden_min, 0.5) AS b_min_med, max(burden_max) AS b_max_hi,\n    approx_percentile(burden_max, 0.5) AS b_max_med\n  FROM base\n  GROUP BY 1\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER () AS n_hidden,\n  ROW_NUMBER() OVER ( ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, has_aircon) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT has_aircon,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_ ow":"10","pct_low":"32.3","n_burden_missing":"0","pct_burden_missing":"0.0"}]},"Q2.9":{"title":"ชั้นรายได้รวมเป็น 3 กลุ่ม (ไม่เกิน 10,000 / 10,001-20,000 / มากกว่า 20,000) x ภาระค่าไฟหน้าร้อน (เกณฑ์ 10%)","file":"q2/Q2_9.csv","sql":"-- Q2.9 ชั้นรายได้รวมเป็น 3 กลุ่ม (ไม่เกิน 10,000 / 10,001-20,000 / มากกว่า 20,000) x ภาระค่าไฟหน้าร้อน (เกณฑ์ 10%)\nWITH base AS (\n  SELECT * FROM bhes.happy_home_household WHERE usable_q2\n), cells0 AS (\n  SELECT CASE WHEN income_ord IS NULL THEN '(null)' WHEN income_ord <= 2 THEN '1) ไม่เกิน 10,000' WHEN income_ord = 3 THEN '2) 10,001-20,000' ELSE '3) มากกว่า 20,000' END AS income_group,\n    count(*) AS n,\n    count_if(burden_class = 'high') AS c_high,\n    count_if(burden_class = 'possibly_high') AS c_possibly_high,\n    count_if(burden_class = 'low') AS c_low,\n    count_if(burden_class IS NULL) AS c_burden_missing,\n    min(burden_min) AS b_min_lo, approx_percentile(burden_min, 0.5) AS b_min_med, max(burden_max) AS b_max_hi,\n    approx_percentile(burden_max, 0.5) AS b_max_med\n  FROM base\n  GROUP BY 1\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER () AS n_hidden,\n  ROW_NUMBER() OVER ( ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, income_group) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT income_group,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_high AS varchar) ELSE '<5' END AS n_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_high / n, 1) AS varchar) ELSE '<5' END AS pct_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_possibly_high AS varchar) ELSE '<5' END AS n_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_possibly_high / n, 1) AS varchar) ELSE '<5' END AS pct_possibly_high,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_low AS varchar) ELSE '<5' END AS n_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_low / n, 1) AS varchar) ELSE '<5' END AS pct_low,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(c_burden_missing AS varchar) ELSE '<5' END AS n_burden_missing,\n  CASE WHEN (NOT sup AND NOT (c_high BETWEEN 1 AND 4 OR c_possibly_high BETWEEN 1 AND 4 OR c_low BETWEEN 1 AND 4 OR c_burden_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_burden_missing / n, 1) AS varchar) ELSE '<5' END AS pct_burden_missing,\n  CASE WHEN NOT sup THEN CAST(ROUND(100 * b_min_lo, 1) AS varchar) ELSE '<5' END AS burden_min_lowest_pct,\n  CASE WHEN NOT sup THEN CAST(ROUND(100 * b_min_med, 1) AS varchar) ELSE '<5' END AS burden_min_median_pct,\n  CASE WHEN NOT sup THEN CAST(ROUND(100 * b_max_med, 1) AS varchar) ELSE '<5' END AS burden_max_median_pct,\n  CASE WHEN NOT sup THEN CAST(ROUND(100 * b_max_hi, 1) AS varchar) ELSE '<5' END AS burden_max_highest_pct\nFROM flagged\nORDER BY income_group;","rows":[{"income_group":"1) ไม่เกิน 10,000","n":"34","n_high":"27","pct_high":"79.4","n_possibly_high":"7","pct_possibly_high":"20.6","n_low":"0","pct_low":"0.0","n_burden_missing":"0","p .10":{"title":"C2.8 x วัสดุ/ช่างราคาแพง (B12)","file":"q3/Q3_10.csv","sql":"-- Q3.10 C2.8 x วัสดุ/ช่างราคาแพง (B12)\nWITH base AS (\n  SELECT * FROM bhes.happy_home_household WHERE usable_q3\n), cells0 AS (\n  SELECT coalesce(CAST(b12_costly AS varchar), '(null)') AS b12_costly,\n    count(*) AS n,\n    count_if(c2_8_heat_retrofit_clean = 'เคย') AS c_retrofit_yes,\n    count_if(c2_8_heat_retrofit_clean = 'ไม่เคย') AS c_retrofit_no,\n    count_if(c2_8_heat_retrofit_clean IS NULL) AS c_retrofit_missing\n  FROM base\n  GROUP BY 1\n), cells AS (\n  SELECT *,\n  CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END AS hid,\n  SUM(CASE WHEN n BETWEEN 1 AND 4 THEN 1 ELSE 0 END) OVER () AS n_hidden,\n  ROW_NUMBER() OVER ( ORDER BY CASE WHEN n BETWEEN 1 AND 4 THEN 1000000 ELSE n END, b12_costly) AS rn_small FROM cells0\n), flagged AS (\n  SELECT *, (hid = 1 OR (n_hidden = 1 AND rn_small = 1)) AS sup FROM cells\n)\nSELECT b12_costly,\n  CASE WHEN NOT sup THEN CAST(n AS varchar) ELSE '<5' END AS n,\n  CASE WHEN (NOT sup AND NOT (c_retrofit_yes BETWEEN 1 AND 4 OR c_retrofit_no BETWEEN 1 AND 4 OR c_retrofit_missing BETWEEN 1 AND 4)) THEN CAST(c_retrofit_yes AS varchar) ELSE '<5' END AS n_retrofit_yes,\n  CASE WHEN (NOT sup AND NOT (c_retrofit_yes BETWEEN 1 AND 4 OR c_retrofit_no BETWEEN 1 AND 4 OR c_retrofit_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_retrofit_yes / n, 1) AS varchar) ELSE '<5' END AS pct_retrofit_yes,\n  CASE WHEN (NOT sup AND NOT (c_retrofit_yes BETWEEN 1 AND 4 OR c_retrofit_no BETWEEN 1 AND 4 OR c_retrofit_missing BETWEEN 1 AND 4)) THEN CAST(c_retrofit_no AS varchar) ELSE '<5' END AS n_retrofit_no,\n  CASE WHEN (NOT sup AND NOT (c_retrofit_yes BETWEEN 1 AND 4 OR c_retrofit_no BETWEEN 1 AND 4 OR c_retrofit_missing BETWEEN 1 AND 4)) THEN CAST(ROUND(100.0 * c_retrofit_no / n, 1) AS varchar) ELSE '<5' END AS pct_retrofit_no,\n  CASE WHEN (NOT sup AND NOT (c_retrofit_yes BETWEEN 1 AND 4 OR c_retrofit_no BETWEEN 1 AND 4 OR c_retrofit_missing BETWEEN 1 AND 4)) THEN C       '<p class="note">' + bi("รันเมื่อ ", "Run on ") + esc(D.meta.runDate) + " · workgroup bhes-wg · ap-southeast-1 · " + bi("ตารางสร้างจาก Parquet ใน S3 curated/", "table built from Parquet in S3 curated/") + "</p></section>" +
      '<section class="panel"><h2>' + bi("คำสั่ง SQL ทั้งหมด", "All SQL statements") + "</h2>" + idx + "</section>" +
      '<section class="panel"><h2>' + bi("อัปเดตหน้านี้", "Refreshing this page") + '</h2><p class="lead">' + bi("รัน analytics/run_athena.py แล้วรัน dashboard/build.py ตัวเลขทุกตัวอ่านจากไฟล์ CSV ไม่ได้พิมพ์เอง", "Run analytics/run_athena.py, then dashboard/build.py. Every number is read from the CSV files, none is typed by hand.") + "</p></section>";
  }

  /* ---------- router ---------- */
  var PAGES = [
    { id: "overview", th: "ภาพรวม", en: "Overview", fn: pageOverview },
    { id: "q1", th: "Q1 ความร้อน", en: "Heat", fn: pageQ1 },
    { id: "q2", th: "Q2 ค่าไฟ", en: "Burden", fn: pageQ2 },
    { id: "q3", th: "Q3 ลำดับช่วยเหลือ", en: "Priority", fn: pageQ3 },
    { id: "method", th: "วิธีการ", en: "Method", fn: pageMethod }
  ];
  function route() {
    var h = (location.hash || "").replace("#", ""), page = PAGES.filter(function (p) { return p.id === h; })[0] || PAGES[0];
    document.getElementById("nav").innerHTML = PAGES.map(function (p) { return '<a href="#' + p.id + '"' + (p === page ? ' aria-current="page"' : "") + ">" + bil(p.th, p.en) + "</a>"; }).join("");
    view.innerHTML = page.fn();
    window.scrollTo(0, 0);
  }
  function setLang(l) {
    app.setAttribute("data-lang", l);
    ["th", "en", "both"].forEach(function (k) { document.getElementById("b-" + k).setAttribute("aria-pressed", String(k === l)); });
    try { localStorage.setItem("bhes-lang", l); } catch (e) { /* storage may be blocked */ }
  }
  document.querySelector(".lang").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) setLang(b.getAttribute("data-l")); });
  var saved = "both"; try { saved = localStorage.getItem("bhes-lang") || "both"; } catch (e) { /* ignore */ }
  document.getElementById("brand-sub").innerHTML = bi("แดชบอร์ดผลวิเคราะห์", "findings dashboard");
  document.getElementById("foot").innerHTML = bi("สแนปช็อตของผล Athena วันที่ ", "Snapshot of the Athena run of ") + esc(D.meta.runDate) + " · Happy Home n=" + esc(dq("rows")) + " · " + bi("ซ่อนเซลล์ที่มีน้อยกว่า 5 บ้าน ไม่มีรหัสครัวเรือนหรือพิกัด", "cells under 5 households hidden; no household ids or coordinates");
  setLang(["th", "en", "both"].indexOf(saved) >= 0 ? saved : "both");
  window.addEventListener("hashchange", route);
  route();
})();
</script>
