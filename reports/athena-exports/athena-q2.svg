<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">Action: Amazon Athena ตัวอย่าง Q2</title>
<desc id="description">ผลสำรวจ Happy Home 88 ครัวเรือน ภาระค่าไฟตามรายได้และการมีเครื่องปรับอากาศ พร้อม SQL ที่ใช้</desc>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fbf9f5"/>
<rect x="64" y="42" width="8" height="34" rx="4" fill="#a92f19"/>
<text x="91" y="67" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="700" fill="#625d54" text-anchor="start" letter-spacing="3">P R E S E N T  &amp;  P R O J E C T</text>
<text x="64" y="132" font-family="Tahoma, Arial, sans-serif" font-size="49" font-weight="700" fill="#a92f19" text-anchor="start">Action: Amazon Athena ตัวอย่าง Q2</text>
<text x="65" y="174" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#242321" text-anchor="start">Q2 ภาระค่าไฟต่างกันอย่างไรตามรายได้และการมีแอร์?</text>
<rect x="1646" y="45" width="210" height="42" rx="21" fill="#ffffff" stroke="#e5dfd5"/>
<text x="1751" y="72" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="700" fill="#a92f19" text-anchor="middle">Q2  ·  QUERY</text>
<line x1="64" y1="195" x2="1856" y2="195" stroke="#e5dfd5" stroke-width="1.5"/>
<rect x="64" y="218" width="884" height="364" rx="18" fill="#14283a"/>
<rect x="64" y="218" width="884" height="56" rx="18" fill="#165da3"/>
<rect x="64" y="250" width="884" height="24" rx="0" fill="#165da3"/>
<text x="92" y="252" font-family="Tahoma, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">SQL  ·  services/dashboard_query/q2.sql</text>
<text x="920" y="252" font-family="Tahoma, Arial, sans-serif" font-size="15" font-weight="400" fill="#e0ecf8" text-anchor="end">จัดกลุ่ม → นับครัวเรือน → ปกปิดค่ากลุ่มเล็ก</text>
<text x="92" y="303.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#ffffff">WITH survey AS (</text>
<text x="92" y="319.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  SELECT ... AS income, ... AS cooling, burden_class</text>
<text x="92" y="336.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  FROM happy_home_risk</text>
<text x="92" y="352.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#ffffff">), totals AS (</text>
<text x="92" y="369.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  SELECT ...</text>
<text x="92" y="385.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">         count(*) AS households,</text>
<text x="92" y="402.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">         count_if(burden_class = 'high') AS high,</text>
<text x="92" y="418.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">         count_if(burden_class = 'possibly_high') AS possibly_high,</text>
<text x="92" y="435.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">         count_if(burden_class = 'low') AS low, ...</text>
<text x="92" y="451.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  FROM survey</text>
<text x="92" y="468.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  GROUP BY GROUPING SETS ((income), (cooling), (income, cooling))</text>
<text x="92" y="484.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#ffffff">), disclosure AS (</text>
<text x="92" y="501.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  SELECT ... bool_or(high BETWEEN 1 AND 4 OR ...) ...</text>
<text x="92" y="517.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">  FROM totals</text>
<text x="92" y="534.0" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#e0ecf8">)</text>
<text x="92" y="550.5" xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="15" fill="#ffffff">SELECT ... IF(hide_size OR hide_burden, NULL, high) AS high ...</text>
<text x="1002" y="250" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#242321" text-anchor="start">สัดส่วนบ้านที่มีภาระค่าไฟสูงตามรายได้</text>
