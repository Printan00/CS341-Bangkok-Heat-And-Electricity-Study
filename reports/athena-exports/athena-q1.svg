<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#fbf9f5"/><rect x="64" y="42" width="8" height="34" rx="4" fill="#a92f19" stroke="none" stroke-width="0"/><text x="91" y="67" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="4">P R E S E N T  &amp;  P R O J E C T</text><text x="64" y="132" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="49" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">Action: Amazon Athena ตัวอย่าง Q1</text><text x="65" y="174" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="24" font-weight="600" fill="#242321" text-anchor="start" letter-spacing="0">Q1  ลักษณะบ้านแบบใดสัมพันธ์กับผลกระทบจากความร้อน?</text><rect x="1646" y="45" width="210" height="42" rx="21" fill="#ffffff" stroke="#e7e1d7" stroke-width="1.4"/><text x="1751" y="72" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="700" fill="#a92f19" text-anchor="middle" letter-spacing="0">Q1  ·  QUERY</text><line x1="64" y1="195" x2="1856" y2="195" stroke="#e7e1d7" stroke-width="2"/><rect x="64" y="218" width="952" height="56" rx="20" fill="#165da3" stroke="none" stroke-width="0"/><rect x="64" y="252" width="952" height="22" fill="#165da3"/><text x="92" y="253" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">SQL  ·  services/dashboard_query/q1.sql</text><rect x="64" y="274" width="952" height="399" rx="0" fill="#14283a" stroke="none" stroke-width="0"/><text x="985" y="253" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="400" fill="#dce9f6" text-anchor="end" letter-spacing="0">ส่วนคัดกรอง + เปรียบเทียบ (ตัดมาเฉพาะบรรทัดสำคัญ)</text><text x="92" y="306" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">WITH base AS (</text><text x="92" y="326" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  SELECT ... , heat_impact_level, heat_impact_score</text><text x="92" y="346" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  FROM happy_home_household</text><text x="92" y="366" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  WHERE usable_q1</text><text x="92" y="386" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    AND heat_impact_level IN ('low','medium','high')</text><text x="92" y="406" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    AND heat_impact_score BETWEEN 0 AND 13</text><text x="92" y="426" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">), features AS (</text><text x="92" y="446" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  SELECT 'comparison' AS kind, feature AS dimension,</text><text x="92" y="466" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">         category AS label, count(*) AS households,</text><text x="92" y="486" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">         count_if(heat_impact_level = 'high') AS high,</text><text x="92" y="506" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">         round(100.0 * count_if(heat_impact_level = 'high') / count(*), 1) AS value</text><text x="92" y="526" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  FROM base CROSS JOIN UNNEST(...)</text><text x="92" y="546" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  GROUP BY feature, category</text><text x="92" y="566" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#8fa8bf" text-anchor="start" letter-spacing="0">), ... heatmap, feature_detail, community, profiles, bands</text><text x="92" y="586" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">SELECT kind, dimension, label, households, high, value,</text><text x="92" y="606" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">       suppressed, low, medium</text><text x="92" y="626" font-family="Menlo, Monaco, monospace" font-size="16" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">FROM disclosure ORDER BY kind, dimension, label;</text><text x="92" y="646" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="400" fill="#bfd0df" text-anchor="start" letter-spacing="0">ผลลัพธ์เป็นแถวสรุปหลายมิติ ไม่คืนข้อมูลรายครัวเรือน</text><text x="1070" y="260" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="23" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">ผลกระทบเฉลี่ยตามการระบายอากาศ × วัสดุผนัง</text><text x="1070" y="290" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">ค่าเฉลี่ย heat_impact_score  ·  ช่วงคะแนน 0–13  ·  ในแต่ละช่องแสดง n</text><text x="1396" y="327" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">ผนังอื่น</text><text x="1622" y="327" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">ผนังไม้</text><text x="1258" y="388" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="600" fill="#242321" text-anchor="end" letter-spacing="0">ดี</text><rect x="1287" y="346" width="218" height="68" rx="12" fill="#e9f0df" stroke="#e3d9ca" stroke-width="1"/><text x="1396" y="376" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">4.86</text><text x="1396" y="399" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=14</text><rect x="1513" y="346" width="218" height="68" rx="12" fill="#f1e6c9" stroke="#e3d9ca" stroke-width="1"/><text x="1622" y="376" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">5.44</text><text x="1622" y="399" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=9</text><text x="1258" y="461" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="600" fill="#242321" text-anchor="end" letter-spacing="0">ปานกลาง</text><rect x="1287" y="419" width="218" height="68" rx="12" fill="#f3dfb7" stroke="#e3d9ca" stroke-width="1"/><text x="1396" y="449" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">5.50</text><text x="1396" y="472" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=10</text><rect x="1513" y="419" width="218" height="68" rx="12" fill="#efc39b" stroke="#e3d9ca" stroke-width="1"/><text x="1622" y="449" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">6.67</text><text x="1622" y="472" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=9</text><text x="1258" y="534" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="600" fill="#242321" text-anchor="end" letter-spacing="0">ไม่ดี</text><rect x="1287" y="492" width="218" height="68" rx="12" fill="#efc39b" stroke="#e3d9ca" stroke-width="1"/><text x="1396" y="522" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">6.70</text><text x="1396" y="545" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=27</text><rect x="1513" y="492" width="218" height="68" rx="12" fill="#e8a17b" stroke="#e3d9ca" stroke-width="1"/><text x="1622" y="522" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">7.95</text><text x="1622" y="545" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="middle" letter-spacing="0">n=19</text><rect x="1070" y="584" width="744" height="58" rx="12" fill="#e4f1ee" stroke="none" stroke-width="0"/><text x="1092" y="609" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#197e73" text-anchor="start" letter-spacing="0">ค่าสูงสุดในภาพ</text><text x="1092" y="632" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="19" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">ผนังไม้ + ระบายอากาศไม่ดี  7.95 / 13  (n=19)</text><text x="90" y="737" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="21" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">ผลลัพธ์ตัวอย่าง  ·  kind = comparison  /  dimension = wall</text><text x="90" y="765" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">เปรียบเทียบสัดส่วนบ้านที่อยู่ในระดับผลกระทบความร้อนสูง</text><rect x="90" y="784" width="1138" height="42" rx="8" fill="#f2eee7" stroke="none" stroke-width="0"/><text x="102" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">กลุ่มผนัง</text><text x="322" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">จำนวนบ้าน</text><text x="542" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">ผลกระทบสูง</text><text x="692" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">สัดส่วนสูง</text><text x="827" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">ปกปิดข้อมูล</text><rect x="90" y="827" width="1138" height="48" rx="6" fill="#fbf4ef" stroke="none" stroke-width="0"/><text x="102" y="859" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">ไม้</text><text x="322" y="859" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">37</text><text x="542" y="859" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">17</text><text x="692" y="859" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">45.9%</text><text x="827" y="859" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">ไม่</text><text x="102" y="910" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">อื่น ๆ</text><text x="322" y="910" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">51</text><text x="542" y="910" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">11</text><text x="692" y="910" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">21.6%</text><text x="827" y="910" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="18" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">ไม่</text><line x1="90" y1="914" x2="1228" y2="914" stroke="#e7e1d7" stroke-width="1"/><text x="90" y="956" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#6f6a62" text-anchor="start" letter-spacing="0">ผนังไม้: 17/37  ·  ผนังอื่น: 11/51</text><text x="90" y="980" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">ตัวเลขนี้เป็นความสัมพันธ์เชิงพรรณนา ไม่ได้ยืนยันเหตุและผล</text><text x="1310" y="738" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="21" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">ประเด็นที่อ่านได้</text><text x="1310" y="789" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="43" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">45.9%</text><text x="1487" y="783" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="600" fill="#242321" text-anchor="start" letter-spacing="0">บ้านผนังไม้มีสัดส่วนผลกระทบสูง</text><text x="1487" y="808" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#6f6a62" text-anchor="start" letter-spacing="0">มากกว่ากลุ่มผนังอื่น 24.3 จุดเปอร์เซ็นต์</text><line x1="1310" y1="834" x2="1826" y2="834" stroke="#e7e1d7" stroke-width="1"/><text x="1310" y="866" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">SQL ยังสรุปประเภทบ้าน หลังคา ฝ้า ฉนวน</text><text x="1310" y="891" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">การระบายอากาศ ร่มเงา ชุมชน และระดับคะแนน</text><rect x="1310" y="918" width="516" height="57" rx="10" fill="#f8e8de" stroke="none" stroke-width="0"/><text x="1330" y="943" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">เซลล์ที่เสี่ยงเปิดเผยกลุ่มเล็กจะถูกซ่อน</text><text x="1330" y="964" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#242321" text-anchor="start" letter-spacing="0">พร้อมค่าและยอดเสริม เพื่อป้องกันการอนุมาน</text><line x1="64" y1="1030" x2="1856" y2="1030" stroke="#e7e1d7" stroke-width="1.5"/><text x="64" y="1058" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">แหล่งข้อมูล: happy_home_household  ·  ใช้เฉพาะ usable_q1  ·  บางกลุ่มเล็กถูกซ่อนตามกติกา n &lt; 5</text><text x="1856" y="1058" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="13" font-weight="700" fill="#6f6a62" text-anchor="end" letter-spacing="1.5">BHES  ·  ATHENA QUERY NOTE</text></svg>