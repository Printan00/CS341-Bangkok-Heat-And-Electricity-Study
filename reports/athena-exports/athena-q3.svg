<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#fbf9f5"/><rect x="64" y="42" width="8" height="34" rx="4" fill="#a92f19" stroke="none" stroke-width="0"/><text x="91" y="67" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="4">P R E S E N T  &amp;  P R O J E C T</text><text x="64" y="132" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="49" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">Action: Amazon Athena ตัวอย่าง Q3</text><text x="65" y="174" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="24" font-weight="600" fill="#242321" text-anchor="start" letter-spacing="0">Q3  บ้านกลุ่มไหนควรได้รับความช่วยเหลือก่อน?</text><rect x="1646" y="45" width="210" height="42" rx="21" fill="#ffffff" stroke="#e7e1d7" stroke-width="1.4"/><text x="1751" y="72" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="700" fill="#a92f19" text-anchor="middle" letter-spacing="0">Q3  ·  QUERY</text><line x1="64" y1="195" x2="1856" y2="195" stroke="#e7e1d7" stroke-width="2"/><rect x="64" y="218" width="884" height="56" rx="20" fill="#165da3" stroke="none" stroke-width="0"/><rect x="64" y="252" width="884" height="22" fill="#165da3"/><text x="92" y="253" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">SQL  ·  services/dashboard_query/q3.sql</text><rect x="64" y="274" width="884" height="336" rx="0" fill="#14283a" stroke="none" stroke-width="0"/><text x="918" y="253" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="400" fill="#dce9f6" text-anchor="end" letter-spacing="0">จัดกลุ่ม → รวมคะแนน → ตรวจขนาดกลุ่ม</text><text x="92" y="304" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">WITH classified AS (</text><text x="92" y="319.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  SELECT CASE</text><text x="92" y="335" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    WHEN exposure &lt; 0.5 THEN 'lower_exposure'</text><text x="92" y="350.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    WHEN vulnerability &gt;= 0.5 THEN 'help_first'</text><text x="92" y="366" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    ELSE 'watch' END AS priority_group,</text><text x="92" y="381.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    risk_score, exposure, vulnerability, ...</text><text x="92" y="397" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  FROM happy_home_risk</text><text x="92" y="412.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  WHERE exposure BETWEEN 0 AND 1</text><text x="92" y="428" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">    AND vulnerability BETWEEN 0 AND 1</text><text x="92" y="443.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">), grouped AS (</text><text x="92" y="459" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  SELECT priority_group, count(*) AS households,</text><text x="92" y="474.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">         round(avg(exposure) * 100, 1) AS exposure,</text><text x="92" y="490" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#8fa8bf" text-anchor="start" letter-spacing="0">         ... averages for risk + 5 indicators</text><text x="92" y="505.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  FROM classified GROUP BY priority_group</text><text x="92" y="521" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">), disclosure AS (</text><text x="92" y="536.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  SELECT *, min(households) OVER () &lt; 5 AS suppressed</text><text x="92" y="552" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">  FROM grouped</text><text x="92" y="567.5" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">)</text><text x="92" y="583" font-family="Menlo, Monaco, monospace" font-size="14.5" font-weight="400" fill="#dce6f0" text-anchor="start" letter-spacing="0">SELECT ... IF(suppressed, NULL, metric) ...</text><text x="1002" y="260" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="22" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">เกณฑ์แบ่งกลุ่มจากเส้น 0.5</text><text x="1002" y="293" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">Exposure = การเผชิญความร้อน  ·  Vulnerability = ความเปราะบาง</text><rect x="1002" y="323" width="299.6363636363636" height="50" rx="12" fill="#a92f19" stroke="none" stroke-width="0"/><text x="1151.8181818181818" y="355" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">ช่วยก่อน  32 บ้าน</text><rect x="1301.6363636363635" y="323" width="421.3636363636364" height="50" rx="4" fill="#d6a35e" stroke="none" stroke-width="0"/><text x="1512.3181818181818" y="355" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="700" fill="#242321" text-anchor="middle" letter-spacing="0">เฝ้าระวัง  45 บ้าน</text><rect x="1723" y="323" width="103" height="50" rx="4" fill="#8ea88e" stroke="none" stroke-width="0"/><text x="1774.5" y="355" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">11</text><text x="1002" y="396" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">36.4%</text><text x="1292" y="396" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#9c7138" text-anchor="start" letter-spacing="0">51.1%</text><text x="1695" y="396" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#737343" text-anchor="start" letter-spacing="0">12.5%</text><line x1="1002" y1="416" x2="1826" y2="416" stroke="#e7e1d7" stroke-width="1"/><rect x="1002" y="435" width="824" height="143" rx="13" fill="#f2eee7" stroke="none" stroke-width="0"/><text x="1024" y="466" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="700" fill="#6f6a62" text-anchor="start" letter-spacing="0">ลำดับกติกา</text><text x="1024" y="496" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="600" fill="#242321" text-anchor="start" letter-spacing="0">1  exposure &lt; 0.5  →  เผชิญความร้อนต่ำกว่าเกณฑ์</text><text x="1024" y="526" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="700" fill="#a92f19" text-anchor="start" letter-spacing="0">2  exposure ≥ 0.5 และ vulnerability ≥ 0.5  →  ช่วยก่อน</text><text x="1024" y="556" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="17" font-weight="600" fill="#242321" text-anchor="start" letter-spacing="0">3  เงื่อนไขอื่น  →  เฝ้าระวัง</text><text x="91" y="672" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="21" font-weight="700" fill="#242321" text-anchor="start" letter-spacing="0">ผลลัพธ์จาก Athena  ·  ค่าเฉลี่ยต่อกลุ่ม (คะแนน 0–100)</text><text x="91" y="700" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">จำนวนบ้าน 88 หลัง  ·  สรุปกลุ่ม ไม่แสดงจุดหรือแถวรายบ้าน</text><rect x="91" y="720" width="1738" height="45" rx="8" fill="#f2eee7" stroke="none" stroke-width="0"/><text x="231" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">กลุ่ม</text><text x="436" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">บ้าน</text><text x="583.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">เสี่ยงรวม</text><text x="748.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">เผชิญร้อน</text><text x="913.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">เปราะบาง</text><text x="1078.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">ความร้อน</text><text x="1243.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">สภาพบ้าน</text><text x="1408.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">การเงิน</text><text x="1573.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">ภาระไฟ</text><text x="1738.5" y="749" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="700" fill="#6f6a62" text-anchor="middle" letter-spacing="0">รับมือ</text><rect x="91" y="778" width="1738" height="52" rx="6" fill="#fbf0eb" stroke="none" stroke-width="0"/><text x="231" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#a92f19" text-anchor="middle" letter-spacing="0">ช่วยก่อน</text><text x="436" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">32</text><text x="583.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">65.9</text><text x="748.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">69.0</text><text x="913.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">62.9</text><text x="1078.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">57.3</text><text x="1243.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">64.1</text><text x="1408.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">56.4</text><text x="1573.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">89.6</text><text x="1738.5" y="811" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">42.7</text><line x1="91" y1="831" x2="1829" y2="831" stroke="#e7e1d7" stroke-width="1"/><text x="231" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#a92f19" text-anchor="middle" letter-spacing="0">เฝ้าระวัง</text><text x="436" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">45</text><text x="583.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">50.0</text><text x="748.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">68.0</text><text x="913.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">32.2</text><text x="1078.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">58.5</text><text x="1243.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">60.2</text><text x="1408.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">29.4</text><text x="1573.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">42.6</text><text x="1738.5" y="868" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">24.4</text><line x1="91" y1="888" x2="1829" y2="888" stroke="#e7e1d7" stroke-width="1"/><text x="231" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="700" fill="#a92f19" text-anchor="middle" letter-spacing="0">เผชิญต่ำกว่าเกณฑ์</text><text x="436" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">11</text><text x="583.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">37.4</text><text x="748.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">44.0</text><text x="913.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">30.8</text><text x="1078.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">27.3</text><text x="1243.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">27.3</text><text x="1408.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">24.4</text><text x="1573.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">45.2</text><text x="1738.5" y="925" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="16" font-weight="500" fill="#242321" text-anchor="middle" letter-spacing="0">22.7</text><text x="91" y="977" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="14" font-weight="500" fill="#6f6a62" text-anchor="start" letter-spacing="0">หากกลุ่มใดมี n &lt; 5 จะซ่อนค่าของทุกกลุ่มในผลลัพธ์ชุดนี้ เพื่อป้องกันการอนุมานย้อนกลับ</text><line x1="64" y1="1030" x2="1856" y2="1030" stroke="#e7e1d7" stroke-width="1.5"/><text x="64" y="1058" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="15" font-weight="400" fill="#6f6a62" text-anchor="start" letter-spacing="0">แหล่งข้อมูล: happy_home_risk  ·  exposure/vulnerability อยู่นอกช่วง 0–1 จะไม่นำมาจัดกลุ่ม  ·  เกณฑ์เป็นกติกาวิเคราะห์ของโครงการ</text><text x="1856" y="1058" font-family="Tahoma, Arial Unicode MS, sans-serif" font-size="13" font-weight="700" fill="#6f6a62" text-anchor="end" letter-spacing="1.5">BHES  ·  ATHENA QUERY NOTE</text></svg>